name: ci
on: [pull_request, push]
jobs:
  unit:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - run: go vet ./...
      - name: Unit tests with race detection and coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./internal/...
      - name: Print coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - uses: golangci/golangci-lint-action@v7
        with:
          version: "v2.11.4"

  e2e:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: E2e tests
        run: go test -v -timeout 180s ./e2e/

  # Real tools (Elixir, Node, Bun, Postgres, Redis, Python, Go, Docker).
  # Each test skips with a reason when its tool is missing.
  realworld:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"
      - name: Install Postgres and Redis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server postgresql
          echo "$(ls -d /usr/lib/postgresql/*/bin | tail -1)" >> "$GITHUB_PATH"
      - name: Pull images used by Docker tests
        run: docker pull postgres:16
      - name: Real-tool tests
        run: go test -tags realworld -v -timeout 900s -run TestRW_ ./e2e/
