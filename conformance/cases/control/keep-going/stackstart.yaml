profiles:
  p:
    processes:
      db:
        cmd: |-
          exec perl -e 'sleep 300' db-${TOKEN}
      migrate:
        kind: oneshot
        cmd: |-
          if [ -f fixed ]; then echo migrated; else echo 'column "owner_ref" contains null values'; exit 1; fi
        depends_on: [db]
      app:
        cmd: |-
          exec perl -e 'sleep 300' app-${TOKEN}
        depends_on: [migrate]
      other:
        cmd: |-
          exec perl -e 'sleep 300' other-${TOKEN}
