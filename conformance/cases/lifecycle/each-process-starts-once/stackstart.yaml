profiles:
  p:
    processes:
      a:
        cmd: |-
          echo start a; exec perl -e 'sleep 300' a-${TOKEN}
      b:
        cmd: |-
          echo start b; exec perl -e 'sleep 300' b-${TOKEN}
      c:
        cmd: |-
          echo start c; exec perl -e 'sleep 300' c-${TOKEN}
      d:
        cmd: |-
          echo start d; exec perl -e 'sleep 300' d-${TOKEN}
        depends_on: [a]
      e:
        cmd: |-
          echo start e; exec perl -e 'sleep 300' e-${TOKEN}
        depends_on: [a, b]
      f:
        kind: oneshot
        cmd: echo start f
