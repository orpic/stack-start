name: chained oneshots run in order, pass captures on, and unblock long-running processes
roadmap: v0
covers: [oneshot]
steps:
  - start: up p
  - wait_output: {id: up, contains: "stackstart: all 3 processes ready", timeout: 10s}
  - expect_output: {id: up, stream: stdout, in_order: ["BUILD_DONE", "INSTALL_DONE", "app       | RECEIVED=abc123secret"]}
  - signal: {id: up, sig: TERM}
  - wait_exit: {id: up, exit: 0, timeout: 15s}
