name: children and grandchildren of a process are stopped with it
roadmap: "0.12"
covers: [child-tree]
steps:
  - start: up p
  - wait_output: {id: up, contains: "1 process ready", timeout: 10s}
  - process: {matches: "^perl -e sleep 300 grandchild-${TOKEN}", count: 1, timeout: 5s}
  - run: down
    expect: {stdout_contains: "Stopped \"p\" in ${WORK}. Logs: "}
  - wait_exit: {id: up, exit: 0, timeout: 5s}
  - process: {matches: "${TOKEN}", absent: true, timeout: 3s}
