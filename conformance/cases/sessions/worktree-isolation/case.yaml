name: down and logs work from a subdirectory, but never from a nested git repo or worktree
roadmap: "0.9"
notes: "fails on v0.2.3: down from .worktrees/feature stopped the main checkout's stack"
steps:
  # A main checkout with a git worktree inside it, like .worktrees/<branch>.
  - sh: |-
      mkdir .git && mkdir -p .worktrees/feature packages/web && printf 'gitdir: ../../.git/worktrees/feature\n' > .worktrees/feature/.git
  - start: up p
  - wait_output: {id: up, contains: "1 process ready", timeout: 10s}
  - run: down
    cwd: .worktrees/feature
    expect: {exit: 1, stderr_contains: "no running stackstart session found for ${WORK}/.worktrees/feature"}
  - run: logs app
    cwd: .worktrees/feature
    expect: {exit: 1, stderr_contains: "no running or previous stackstart session found for ${WORK}/.worktrees/feature"}
  - alive: {id: up, for: 300ms}
  - start: logs app
    id: follow
    cwd: packages/web
  - wait_output: {id: follow, stream: stdout, contains: "main checkout", timeout: 5s}
  - signal: {id: follow, sig: INT}
  - wait_exit: {id: follow, exit: 0, timeout: 5s}
  - run: down
    cwd: packages/web
    expect: {stdout_contains: "Stopped \"p\" in ${WORK}."}
  - wait_exit: {id: up, exit: 0, timeout: 5s}
