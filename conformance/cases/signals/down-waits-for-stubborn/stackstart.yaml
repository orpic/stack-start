profiles:
  p:
    processes:
      app:
        cmd: |-
          exec perl -e '$|=1; $SIG{TERM} = sub { print "ignoring TERM\n" }; $SIG{INT} = sub { print "ignoring INT\n" }; $SIG{HUP} = sub { print "ignoring HUP\n" }; print "stubborn ready\n"; sleep 1 while 1' ${TOKEN}
        stop_grace_period: 1s
        readiness: {timeout: 5s, checks: [{log: "stubborn ready"}]}
