profiles:
  p:
    processes:
      tunnel:
        cmd: |-
          echo url=https://mcp.example.com; exec perl -e 'sleep 300' t-${TOKEN}
        captures: [{name: url, log: "url=(\\S+)"}]
      api:
        cmd: |-
          echo api says hello; exec perl -e 'sleep 300' a-${TOKEN}
        depends_on: [tunnel]
        env: {URL: "${tunnel.url}"}
