profiles:
  p:
    processes:
      cloudflared:
        # cloudflared's real failure: the error line contains a trycloudflare.com URL.
        cmd: |-
          echo 'INF Requesting new quick Tunnel on trycloudflare.com...'; sleep 0.2; echo 'ERR failed to request quick Tunnel: Post "https://api.trycloudflare.com/tunnel": context deadline exceeded'; exec perl -e 'sleep 300' ${TOKEN}
        readiness:
          timeout: 30s
          checks:
            - capture: url
        captures:
          - name: url
            log: "(https://[a-z0-9]+(?:-[a-z0-9]+)+\\.trycloudflare\\.com)"
        fail_on:
          - "failed to request quick Tunnel"
      backend:
        cmd: echo backend got $TUNNEL_URL; exec perl -e "sleep 300" ${TOKEN}
        depends_on: [cloudflared]
        env:
          TUNNEL_URL: "${cloudflared.url}"
        readiness: {timeout: 5s, checks: [{log: "backend got"}]}
