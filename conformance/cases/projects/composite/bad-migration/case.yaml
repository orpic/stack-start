name: "Composite: a failing migration stops the stack with the migration's error, and Phoenix never starts"
roadmap: "0.7, 0.12"
covers: [oneshot, ready-then-crash]
project: test-projects
requires: ["mix --version", "initdb --version", "test -d phoenix_app/deps", "test -d node_api/node_modules"]
timeout: 400s
notes: "Phase 1 (--keep-going, start <p>) will extend this: keep Postgres up, fix, rerun only the migration"
steps:
  - start: up bad-migration
  - wait_exit: {id: up, exit: 1, timeout: 240s}
  - expect_output:
      id: up
      stream: stderr
      contains: ["--- FAILED: migrate ---", "Cause: oneshot process failed: exit status 1", "contains null values", "Read it later with: stackstart logs migrate"]
  - expect_output: {id: up, stream: stdout, not_contains: "phoenix  |"}
  - port: {addr: "127.0.0.1:5545", open: false, timeout: 5s}
  - run: logs migrate --profile bad-migration
    expect: {stdout_contains: "column \"organization_id\" of relation \"notes\" contains null values", stdout_not_contains: "\e"}
