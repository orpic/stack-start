name: "Config cascade: inside a project, its own profiles and the composite profiles above it are both visible"
roadmap: v0
project: test-projects/phoenix_app
steps:
  - run: list
    expect:
      stdout_contains:
        - "(from ${ROOT}/test-projects/phoenix_app/stackstart.yaml)"
        - "(from ${ROOT}/test-projects/stackstart.yaml)"
        - "fullstack-offline"
        - "iex"
  - run: validate dev
    expect: {stdout_contains: "Profile \"dev\" from ${ROOT}/test-projects/phoenix_app/stackstart.yaml is valid."}
  - run: validate fullstack-offline
    expect: {stdout_contains: "Profile \"fullstack-offline\" from ${ROOT}/test-projects/stackstart.yaml is valid."}
  - run: list
    cwd: ../node_api
    expect: {stdout_contains: ["(from ${ROOT}/test-projects/node_api/stackstart.yaml)", "fullstack"], stdout_not_contains: "iex"}
