name: "Django: setup creates the venv; migrate then runserver; an edit reloads the server; down leaves nothing"
roadmap: "0.7, 0.12"
covers: [self-restart, oneshot]
project: test-projects/django_app
requires: ["python3 --version"]
timeout: 600s
steps:
  - port: {addr: "127.0.0.1:8100", open: false, timeout: 1s}
  - run: up setup
    id: setup
    timeout: 400s
    expect: {stderr_contains: "all processes finished"}
  - start: up dev
  - wait_output: {id: up, stream: stderr, contains: "all 2 processes ready", timeout: 60s}
  - http: {url: "http://127.0.0.1:8100/", body_contains: "Hello from Django", timeout: 10s}
  - run: status --json
    save_json: {SEQ: "sessions[0].events.last_seq"}
  - mark: {id: up, name: before-edit}
  - edit_file: {path: djsite/views.py, replace: {from: "Hello from Django", to: "Hello again from Django"}}
  # runserver's StatReloader restarts the server inside the same process.
  - wait_output: {id: up, stream: stdout, contains: "djsite/views.py changed, reloading.", since: before-edit, timeout: 20s}
  - wait_output: {id: up, stream: stdout, contains: "Starting development server at http://127.0.0.1:8100/", since: before-edit, timeout: 20s}
  - run: wait web --for rebuilt --after ${SEQ} --timeout 20s
    expect: {stdout_contains: "rebuild_finished web"}
  - http: {url: "http://127.0.0.1:8100/", body_contains: "Hello again from Django", timeout: 10s}
  - run: down
    expect: {stdout_contains: "Stopped \"dev\" in ${WORK}."}
  - wait_exit: {id: up, exit: 0, timeout: 5s}
  - port: {addr: "127.0.0.1:8100", open: false, timeout: 5s}
  - run: logs web
    expect:
      stdout_in_order: ["Starting development server", "\"GET / HTTP/1.1\" 200", "changed, reloading.", "Watching for file changes with StatReloader", "Starting development server"]
      stdout_not_contains: "\e"
  - run: logs migrate
    expect: {stdout_contains: "Operations to perform:"}
  - sh: rm -f db.sqlite3
