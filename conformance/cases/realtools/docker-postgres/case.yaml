name: "Docker postgres: gate on the final listen line, not the port proxy or the init server"
roadmap: "0.3"
covers: [early-port]
home: real
requires: ["docker image inspect postgres:16", "psql --version"]
ports: [pg]
timeout: 180s
notes: "Docker's proxy accepts TCP before postgres listens, and the image prints 'ready to accept connections' for a temporary init server first"
steps:
  - start: up p
  - wait_output: {id: up, contains: "all 2 processes ready", timeout: 120s}
  - run: down
    timeout: 60s
  - wait_exit: {id: up, exit: 0, timeout: 5s}
  - run: logs query
    expect: {stdout_contains: "42"}
  - sh: |-
      for i in $(seq 1 60); do [ -z "$(docker ps -aq --filter name=ss-${TOKEN})" ] && exit 0; sleep 0.5; done; echo "container still exists"; exit 1
    timeout: 40s
